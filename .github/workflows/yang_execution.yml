name: "Yang Execution & Outreach Loop (3-Hour Cycle)"

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no external network mutations)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: yang-execution-lock
  cancel-in-progress: false

jobs:
  execution:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Chromium Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Execute Engine YANG (Outreach & Vibe-Coding)
        env:
          LINKEDIN_COOKIE: ${{ secrets.LINKEDIN_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "$LINKEDIN_COOKIE" ]; then
            echo "Running in SAFE DRY-RUN mode..."
            python engines/yang_execution.py --dry-run
          else
            echo "Running in LIVE OUTREACH mode..."
            python engines/yang_execution.py --live
          fi

      - name: Commit & Push Execution State & Portfolio Blueprints
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(yang): sync engagement state and portfolio blueprints [skip ci]"
          file_pattern: "reports/state.json portfolio_lab/generated_repos/**"
          commit_user_name: "Yang-Agent [Bot]"
          commit_user_email: "yang-bot@users.noreply.github.com"

